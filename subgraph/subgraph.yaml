specVersion: 0.0.5
description: Modus Ops verdict subgraph — indexes VerdictLogged events on Arbitrum One
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: VerdictRegistry
    network: arbitrum-one
    source:
      address: "0xDC943Faa749967DBdB82dD0ec808BdFB28CF8338"
      abi: VerdictRegistry
      startBlock: 502588185
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Case
        - VerdictLog
      abis:
        - name: VerdictRegistry
          file: ./abis/VerdictRegistry.json
      eventHandlers:
        - event: VerdictLogged(indexed string,indexed bytes32,uint8,uint8,uint8,uint256,indexed address)
          handler: handleVerdictLogged
      file: ./src/mapping.ts
